name: CI

on:
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main, master ]

jobs:
  # Static analysis and linting
  lint:
    name: Static Analysis & Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Check Go code formatting (gofmt)
      run: |
        unformatted=$(gofmt -s -l $(find . -type f -name '*.go'))
        if [ -n "$unformatted" ]; then
          echo "The following files are not properly formatted:"
          echo "$unformatted"
          echo "Run 'gofmt -s -w .' to fix formatting issues"
          exit 1
        fi

    - name: Install goimports
      run: go install golang.org/x/tools/cmd/goimports@latest

    - name: Check Go imports formatting (goimports)
      run: |
        unformatted=$(goimports -l $(find . -type f -name '*.go'))
        if [ -n "$unformatted" ]; then
          echo "The following files have incorrect import formatting:"
          echo "$unformatted"
          echo "Run 'goimports -w .' to fix import issues"
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Run staticcheck
      run: staticcheck ./...

    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: v1.64.8
        args: --timeout=5m

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: govulncheck ./...

    - name: Install shellcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Run shellcheck on bash scripts
      run: |
        echo "Linting shell scripts with shellcheck..."
        find . -name "*.sh" -type f -exec shellcheck -S error -s bash {} +

  # Unit tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint  # Run tests only if linting passes

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Create bin directory
      run: mkdir -p bin

    - name: Build zenlog binary
      run: go build -o bin/zenlog ./zenlog/cmd/zenlog

    - name: Run unit tests
      run: go test -v -race ./...

    - name: Run unit tests with coverage
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # End-to-end tests
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: test  # Run e2e tests only if unit tests pass

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Create bin directory
      run: mkdir -p bin

    - name: Build zenlog binary
      run: go build -o bin/zenlog ./zenlog/cmd/zenlog

    - name: Run e2e tests
      run: |
        # Run all e2e test scripts
        for test in e2etests/test*.sh; do
          echo "Running $test"
          "$test"
        done

  # Multi-platform testing
  test-matrix:
    name: Cross-Platform Tests
    runs-on: ${{ matrix.os }}
    needs: lint  # Run cross-platform tests in parallel with unit tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Build all packages
      run: go build ./...

    - name: Run unit tests
      run: go test -v -race ./...
